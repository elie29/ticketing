x-backend-environment: &backend-environment
  JWT_KEY: ${JWT_KEY:?JWT_KEY is required; set it in .env (see .env.example)}
  MONGO_USR: ${MONGO_ROOT_USERNAME:-root}
  MONGO_PWD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required; set it in .env (see .env.example)}

x-api-healthcheck: &api-healthcheck
  test:
    - CMD
    - node
    - -e
    - "require('http').get('http://127.0.0.1:' + process.env.SERVER_PORT, response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
  interval: 10s
  timeout: 5s
  start_period: 20s
  retries: 12

services:
  nginx:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      auth:
        condition: service_healthy
      tickets:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - ticketing-network

  auth:
    build:
      context: .
      dockerfile: backend/common/Dockerfile
      target: service
      args:
        SERVICE: auth
    init: true
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MONGO_URI: mongodb://mongo:27017/auth
      SERVER_PORT: "3001"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck: *api-healthcheck
    networks:
      - ticketing-network

  tickets:
    build:
      context: .
      dockerfile: backend/common/Dockerfile
      target: service
      args:
        SERVICE: tickets
    init: true
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MONGO_URI: mongodb://mongo:27017/tickets
      SERVER_PORT: "3003"
      NATS_CLIENT: tickets
      NATS_URL: nats://nats:4222
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck: *api-healthcheck
    networks:
      - ticketing-network

  orders:
    build:
      context: .
      dockerfile: backend/common/Dockerfile
      target: service
      args:
        SERVICE: orders
    init: true
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MONGO_URI: mongodb://mongo:27017/orders
      SERVER_PORT: "3002"
      ORDER_EXPIRATION_SECONDS: ${ORDER_EXPIRATION_SECONDS:-900}
      NATS_CLIENT: orders
      NATS_URL: nats://nats:4222
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck: *api-healthcheck
    networks:
      - ticketing-network

  expiration:
    build:
      context: .
      dockerfile: backend/common/Dockerfile
      target: service
      args:
        SERVICE: expiration
    init: true
    restart: unless-stopped
    environment:
      NATS_CLIENT: expiration
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketing-network

  mongo:
    image: docker.io/library/mongo:9.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required; set it in .env (see .env.example)}
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    networks:
      - ticketing-network

  nats:
    image: docker.io/library/nats:2.12-alpine
    restart: always
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - jetstream-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ticketing-network

  redis:
    image: docker.io/library/redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ticketing-network

networks:
  ticketing-network:

volumes:
  jetstream-data:
