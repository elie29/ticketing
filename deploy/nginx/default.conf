server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/users/ {
        proxy_pass http://auth:3001;
    }

    location /api/tickets {
        proxy_pass http://tickets:3003;
    }

    location /api/orders {
        proxy_pass http://orders:3002;
    }

    # Any other API path is unknown; it must not fall through to the app page.
    # The exact match stops nginx redirecting /api/users to the auth location.
    location = /api/users {
        default_type application/json;
        return 404 '{"errors":[{"message":"Not found"}]}';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"errors":[{"message":"Not found"}]}';
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every page URL is served by the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
